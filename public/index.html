<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    (function() {
      // Target path based on language match
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      var target = lang.startsWith('hu') ? 'hu/' : 'en/';

      // Immediate redirect using location.replace to avoid clogging browser history
      window.location.replace(window.location.pathname.replace("index.html", target) + "index.html");
    })();
  </script>
</head>
<body>
  <p>Redirecting / Átirányítás...</p>
</body>
</html>
